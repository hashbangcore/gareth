[package]
authors = ["Hash <hashbangcore@duck.com>"]
categories = ["command-line-utilities"]
description = "LLM agent harness for pipelines."
edition = "2024"
keywords = ["cli", "llm", "linux"]
license = "BSD-2-Clause"
name = "gareth"
readme = "README.md"
repository = "https://github.com/hashbangcore/gareth"
rust-version = "1.88"
version = "0.3.0"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.13.4", features = ["json"] }
http = "1"
rmcp = { version = "3.6.0", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
termimad = "0.35.5"
terminal_size = "0.4.4"
tokio = { version = "1.52.3", features = ["full"] }
