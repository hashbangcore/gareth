[package]
authors = ["Hash <hashbangcore@duck.com>"]
categories = ["command-line-utilities"]
description = "LLM agent harness for pipelines."
edition = "2024"
keywords = ["cli", "llm", "linux"]
license = "BSD-2-Clause"
name = "gareth"
readme = "README.md"
repository = "https://github.com/hashbangcore/gareth"
version = "0.1.2"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive", "env"] }
clap_complete = "4"
futures-util = "0.3.32"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
termimad = "0.35.5"
terminal_size = "0.4.4"
tokio = { version = "1.52.3", features = ["full"] }
